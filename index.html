<style>
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --tx: #0f172a;
  --mut: #64748b;
  --bd: #e2e8f0;
  --pri: #0f8a5f;
  --pri-soft: #e1f3ea;
  --ok: #2f9e8a;
  --bad: #d9566b;
  --warn: #cf9a2e;
  --soft: #f1f5f9;
  --amber: #a8741a;
  --radius: 22px;
  --shadow-sm: 0 1px 3px rgba(15, 23, 42, .06);
  --shadow: 0 10px 25px -5px rgba(15, 23, 42, .05), 0 8px 10px -6px rgba(15, 23, 42, .03);
  --touch: 44px;
  color-scheme: only light;
}

:root[data-theme="dark"] {
  --bg: #0A1410;
  --card: #151c2c;
  --tx: #f8fafc;
  --mut: #94a3b8;
  --bd: #26334d;
  --pri: #34d399;
  --pri-soft: rgba(52,211,153,.14);
  --ok: #4fbfa5;
  --bad: #ec8696;
  --warn: #e6bd62;
  --soft: #1a2336;
  --amber: #e6bd62;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3);
  --shadow: 0 12px 30px rgba(0,0,0,.35);
  color-scheme: only dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0); }

body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: transparent; /* warna dasar #0A1410 berasal dari <html>, supaya cahaya ambient tampil di atasnya */
  color: var(--tx);
  font-size: 14px;
  line-height: 1.5;
  padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased;
}

button, [role="button"] { cursor: pointer; border: none; background: none; font: inherit; }

.ic {
  width: 1.15em; height: 1.15em; vertical-align: -.22em; fill: none; stroke: currentColor;
  stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0;
}

.w {
  max-width: 680px;
  margin: 0 auto;
  padding: 16px;
  padding-top: calc(16px + env(safe-area-inset-top, 0px));
}

.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  gap: 12px;
}

.brand-title {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.03em;
  color: var(--tx);
  line-height: 1.2;
}

.card {
  background: var(--card);
  border: 1px solid color-mix(in srgb, var(--bd) 70%, transparent);
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: transform .15s ease, border-color .15s ease;
}

.hero {
  background: linear-gradient(135deg, #064e3b 0%, #0f8a5f 50%, #10b981 100%) !important;
  color: #fff !important;
  border: 0 !important;
  position: relative;
  overflow: hidden;
  border-radius: 26px !important;
  box-shadow: 0 12px 32px rgba(6, 95, 70, 0.3) !important;
}

.hero::after {
  content: ""; position: absolute; right: -50px; top: -50px; width: 170px; height: 170px;
  border-radius: 50%; background: rgba(255, 255, 255, 0.1); pointer-events: none;
}

:root[data-theme="dark"] .hero {
  background: linear-gradient(135deg, #03150f 0%, #0a3d2f 50%, #064e3b 100%) !important;
  border: 1px solid var(--bd) !important;
}

.hero .sm { color: rgba(255, 255, 255, 0.8) !important; font-weight: 500; }
.hero .tb { color: #fecdd3 !important; font-weight: 700; }
.hero .tg { color: #a7f3d0 !important; font-weight: 700; }

.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.nw { flex-wrap: nowrap; }
.end { justify-content: flex-end; margin-top: 16px; gap: 8px; }
.sm { font-size: 12.5px; color: var(--mut); }
.bold { font-weight: 700; }
.tb { color: var(--bad); font-weight: 700; }
.tg { color: var(--ok); font-weight: 700; }
.tw { color: var(--amber); font-weight: 700; }

.b {

  color: var(--tx);
  border-radius: 14px;
  padding: 10px 16px;
  min-height: 42px;

}
.b:active { transform: scale(.96); }

.il { display: flex; flex-direction: column; gap: 10px; }
.it {
  display: flex;
  justify-content: space-between;
  align-items: center;

/* Timeline History Styles */
.hist-analytics-card {

  transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 10px 18px;
  border-radius: 99px; z-index: 100; font-size: 13px; font-weight: 600;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: 90vw; text-align: center;
}

.kp { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.kp .b { padding: 14px 0; font-size: 17px; min-height: 48px; }
.kp .eq { grid-row: span 2; background: var(--pri); color: #fff; border-color: var(--pri); }

.an-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.an-net { margin-top: 10px; padding: 10px 14px; background: var(--soft); border-radius: 12px; font-size: 13.5px; display: flex; justify-content: space-between; align-items: center; }

.ell { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowrap { white-space: nowrap; flex: none; }
.money { font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 24px 12px; color: var(--mut); font-size: 13.5px; }

.pl { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--bd); }
.pr {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; grid-template-areas: "i n b" "i s a";
  gap: 2px 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--bd);
  border-left: 4px solid var(--pri); border-radius: 12px; background: var(--soft);
}
.pr.saving { border-left-color: var(--ok); }
.pr.emergency { border-left-color: var(--warn); }
.pr.spending { border-left-color: #06b6d4; }
.pr.main { border-left-color: var(--mut); }
.pi { grid-area: i; font-size: 18px; text-align: center; }
.pn { grid-area: n; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.pb { grid-area: b; font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.ps { grid-area: s; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; }
.pa { grid-area: a; display: flex; gap: 4px; justify-content: flex-end; }

.sensor-on .mask-money { filter: blur(7px); transition: filter .2s; user-select: none; }
.sensor-on .mask-money.reveal { filter: none; }
.banner { background: var(--pri-soft); border: 1px solid var(--pri); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
.banner .row { justify-content: flex-start; margin-top: 10px; }
.bi { margin-top: 12px; }
.mi { padding: 10px 0; border-bottom: 1px solid var(--bd); }
.mi:last-child { border-bottom: 0; }
.sec-title { margin: 20px 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); }
.actions { display: flex; gap: 6px; }

.tr-svg { width: 100%; height: auto; display: block; }
.tr-leg { display: flex; gap: 14px; font-size: 12px; color: var(--mut); margin: 8px 0 12px; }
.tr-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

@keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes cardSlideUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes donutSpin { from { transform: rotate(-180deg) scale(0.92); opacity: 0.5; } to { transform: rotate(-90deg) scale(1); opacity: 1; } }
@keyframes strokeDraw { from { stroke-dasharray: 0 300; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes ringDraw { from { stroke-dasharray: 0 200; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }

.tab-enter > .card { animation: cardSlideUp .38s cubic-bezier(.16,1,.3,1) both; }
.tab-enter > .card:nth-child(2) { animation-delay: .05s; }
.tab-enter > .card:nth-child(3) { animation-delay: .1s; }
.tab-enter > .card:nth-child(4) { animation-delay: .15s; }
.tab-enter .bar i { animation: barGrow .8s cubic-bezier(.16,1,.3,1) both; }
.tab-enter .donut-svg { animation: donutSpin .7s cubic-bezier(.16,1,.3,1) forwards; }
.tab-enter .donut-segment { animation: strokeDraw 1s cubic-bezier(.16,1,.3,1) forwards; }
.tab-enter .rg-fg { animation: ringDraw .9s cubic-bezier(.16,1,.3,1) both; }

@media (max-width: 560px) {
  .ov { align-items: flex-end; padding: 0; }
  .mod { border-radius: 26px 26px 0 0; max-height: 92vh; padding-bottom: calc(22px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .25s ease-out; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

input.enhi{display:none}
#pig{max-height:64vh;overflow-y:auto}
.ig{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:6px}
.ib{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:14px;background:var(--soft);color:var(--tx);font-size:22px;border:1px solid transparent;transition:transform .12s}
.ib:active{transform:scale(.92)}
.ib.on{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}

.month-nav{display:flex;align-items:center;gap:6px}
.month-nav .label{flex:1;min-width:0;font-weight:700;font-size:13px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.month-nav .b{padding:6px 10px;flex:none}
</style>

function tokenizeExpr(s) {
  const tokens = [];
  let i = 0;
  while (i < s.length) {
    const c = s[i];
    if ('+-*/()'.includes(c)) { tokens.push(c); i++; continue; }
    if (c === '.' || (c >= '0' && c <= '9')) {
      let j = i + 1;
      while (j < s.length && ((s[j] >= '0' && s[j] <= '9') || s[j] === '.')) j++;
      const num = s.slice(i, j);
      if (!/^\d+(\.\d+)?$/.test(num) && !/^\.\d+$/.test(num)) throw new Error('bad num');
      tokens.push(num);
      i = j;
      continue;
    }
    throw new Error('bad char');
  }
  return tokens;
}

function parseExpr(tokens) {
  let i = 0;
  function peek() { return tokens[i]; }
  function eat(t) { if (peek() === t) { i++; return true; } return false; }
  function primary() {
    if (eat('+')) return primary();
    if (eat('-')) return -primary();
    if (eat('(')) { const v = expr(); if (!eat(')')) throw new Error('paren'); return v; }
    const t = peek();
    if (t == null || '+-*/()'.includes(t)) throw new Error('num');
    i++; return parseFloat(t);
  }
  function term() {
    let v = primary();
    while (peek() === '*' || peek() === '/') {
      const op = tokens[i++]; const r = primary();
      v = op === '*' ? v * r : v / r;
    }
    return v;
  }
  function expr() {
    let v = term();
    while (peek() === '+' || peek() === '-') {
      const op = tokens[i++]; const r = term();
      v = op === '+' ? v + r : v - r;
    }
    return v;
  }
  const v = expr();
  if (i !== tokens.length) throw new Error('trail');
  return v;
}

function ev(s) {

  if (pk && t.pocketAmt != null && t.type !== 'goal' && t.type !== 'transfer') {

function dropBdg() {
  if (S.config.bdg) return;
  const B = n => /bandung/i.test(n || '');
  const dead = S.categories.filter(c => B(c.name)).map(c => c.id);
  const to = fallbackCat();
  if (dead.length) {
    const fx = a => a.forEach(x => { if (dead.includes(x.categoryId)) x.categoryId = to; });
    fx(S.transactions); fx(S.recurring); fx(S.autos); fx(S.tpls);
  }
  S.categories = S.categories.filter(c => !B(c.name));
  const dw = S.wallets.filter(w => B(w.name)).map(w => w.id);
  if (dw.length && S.wallets.length > dw.length) {
    S.wallets = S.wallets.filter(w => !B(w.name));
    S.recurring = S.recurring.filter(r => !dw.includes(r.walletId));
    S.autos = S.autos.filter(a => !dw.includes(a.walletId));
    S.tpls = S.tpls.filter(t => !dw.includes(t.walletId));
    S.pockets = S.pockets.filter(p => !dw.includes(p.walletId));
    if (dw.includes(FW)) FW = '';
  }
  S.goals = S.goals.filter(g => !B(g.title));
  S.wishlist = S.wishlist.filter(w => !B(w.title));
  S.config.bdg = 1;
  save();
}

function runAuto() {
  const cm = ymOf();
  let n = 0;
  S.autos.forEach(a => {
    let m = a.last;
    if (!m) return;
    for (let i = 0; i < 1200 && m < cm; i++) {
      const next = shiftYm(m, 1);
      const dim = daysInYm(next);
      const day = Math.min(a.day, dim);
      const dt = `${next}-${p2(day)}`;
      if (dt > today()) break;
      const created = addTx({
        id: uid('t'), date: dt + 'T08:00', type: a.type, title: a.title,
        amount: a.amount, walletId: a.walletId, categoryId: a.categoryId || '', auto: 1
      });
      if (!created) break;
      a.last = m = next;
      n++;
    }
  });
  if (n) { save(); toast(n + ' transaksi otomatis dicatat'); }
}

function runBills() {
  const cm = ymOf(), td = today();
  let n = 0;
  S.recurring.forEach(r => {
    if (!r.auto || r.paidMonth === cm || !billDue(r, cm)) return;
    const dt = `${cm}-${p2(billDay(r, cm))}`;
    if (dt > td || (r.autoSince && dt < r.autoSince)) return;
    if (!S.wallets.some(w => w.id === r.walletId)) return;
    const ok = addTx({
      id: uid('t'), date: dt + 'T08:00', type: 'expense', title: 'Tagihan: ' + r.title,
      amount: r.amount, walletId: r.walletId, categoryId: r.categoryId || '',
      billId: r.id, pocketId: r.pocketId, auto: 1
    });
    if (ok) { r.paidMonth = cm; n++; }
  });
  if (n) { save(); toast(n + ' tagihan dipotong otomatis'); }
}

function catData(tx) {

      name: c ? c.name : 'Lainnya',
      label: c ? c.icon + ' ' + c.name : 'Lainnya',

const COL = ['#0f8a5f', '#d4a017', '#2dd4bf', '#a3e635', '#38bdf8', '#f472b6', '#94a3b8', '#fb923c', '#6ee7b7'];

function donut(d) {
  const T = sum(d, x => x.val);
  if (!T) return '<div class="empty">Belum ada pengeluaran.</div>';
  const R = 40, C = 2 * Math.PI * R;
  let o = 0;
  const arcs = d.map((x, i) => {
    const l = x.val / T * C;
    const s = `<circle class="donut-segment" r="${R}" cx="60" cy="60" fill="none" stroke="${COL[i % COL.length]}" stroke-width="20" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-o}" />`;
    o += l;
    return s;
  }).join('');
  const legend = d.map((x, i) => {
    const pct = Math.round(x.val / T * 100);
    const name = x.name || x.label;
    const icon = x.icon ? esc(x.icon) + ' ' : '';
    return `<div class="leg-row">
      <span class="leg-swatch" style="background:${COL[i % COL.length]}"></span>
      <span class="leg-name">${icon}${esc(name)}</span>
      <span class="leg-meta">
        <b class="money mask-money">${fmt(x.val)}</b>
        <span class="sm" style="color:var(--mut)">(${pct}%)</span>
      </span>
    </div>`;
  }).join('');

  const humanTotal = fmtHuman(T);

  return `<div class="donut-wrap">
    <svg class="donut-svg" viewBox="0 0 120 120" width="130" height="130" aria-hidden="true">${arcs}
      <g transform="rotate(90 60 60)">
        <text class="mask-money" x="60" y="57" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor">${humanTotal}</text>
        <text x="60" y="71" text-anchor="middle" font-size="9" fill="currentColor" opacity=".6">total</text>
      </g>
    </svg>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

function evalAB() {
  const n = new Date();
  const ms = [1, 2, 3].map(i => {
    const d = new Date(n.getFullYear(), n.getMonth() - i, 1);
    return ymOf(d);
  });
  return S.categories.filter(c => c.type === 'limit' && c.budget > 0).map(c => {
    const tx = S.transactions.filter(t =>
      t.type === 'expense' && t.categoryId === c.id && ms.some(m => t.date.startsWith(m))
    );
    const act = ms.filter(m => tx.some(t => t.date.startsWith(m)));
    if (!act.length) return null;
    const avg = Math.round(sum(tx, t => t.amount) / act.length);
    let nb = c.budget, code = '';
    if (avg > c.budget) { nb = Math.ceil(avg * 1.1 / 10000) * 10000; code = 'up'; }
    else if (avg < c.budget * .7) { nb = Math.ceil(avg * 1.05 / 10000) * 10000; code = 'down'; }
    return nb !== c.budget
      ? { id: c.id, name: c.name, icon: c.icon, old: c.budget, nb, avg, code, n: act.length }
      : null;
  }).filter(Boolean);
}

function analyze3() {
  const n = new Date(), cm = ymOf(), N = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate();
  const fr = n.getDate() / N, ms = last3();
  const first = S.transactions.length
    ? S.transactions.map(t => t.date.slice(0, 7)).sort()[0]
    : cm;
  const used = ms.filter(m => m >= first).sort();
  if (!S.transactions.length || !used.length) {
    info('Analisa 3 Bulan', '<div class="empty">Belum ada transaksi untuk dianalisa.</div>');
    return;
  }
  const G = m => S.transactions.filter(t => t.date.startsWith(m));
  const X = (m, k) => sum(G(m).filter(t => t.type === k), t => t.amount);
  const tx = S.transactions.filter(t => used.some(m => t.date.startsWith(m)));
  const inc = sum(tx.filter(t => t.type === 'income'), t => t.amount);
  const ex = sum(tx.filter(t => t.type === 'expense'), t => t.amount);
  const comp = used.filter(m => m !== cm).length;
  const wt = comp + (used.includes(cm) ? (comp ? fr : 1) : 0) || 1;
  const cd = catData(tx).slice(0, 3);
  const mx = Math.max(1, ...used.map(m => X(m, 'expense')));
  const sr = inc > 0 ? Math.round((inc - ex) / inc * 100) : null;
  const trend = used.map(m => {
    const e = X(m, 'expense'), i = X(m, 'income');
    return `<div class="row sm" style="margin-top:6px"><span>${m}${m === cm ? ' (berjalan)' : ''}</span><span>▲ ${fmask(i)} · ▼ ${fmask(e)}</span></div>
      <div class="bar"><i class="${e > i && i > 0 ? 'x' : ''}" style="width:${(e / mx * 100).toFixed(0)}%"></i></div>`;
  }).join('');
  info('Analisa 3 Bulan', `
    <div class="g2">
      <div class="it c"><span class="sm">Rata-rata masuk / bln</span><b class="tg money">${fmask(Math.round(inc / wt))}</b></div>
      <div class="it c"><span class="sm">Rata-rata keluar / bln</span><b class="tb money">${fmask(Math.round(ex / wt))}</b></div>
    </div>
    <div class="it c" style="margin-top:8px"><span class="sm">Rasio tabungan</span>
      <b class="${sr !== null && sr < 0 ? 'tb' : 'tg'}">${sr === null ? '-' : sr + '%'}</b></div>
    <div class="it c" style="margin-top:8px"><b>3 kategori terboros</b>
      ${cd.map((x, i) => `<div class="row sm" style="margin-top:4px"><span>${i + 1}. ${esc(x.label)}</span><b class="money">${fmask(x.val)}</b></div>`).join('') || '<div class="sm">Belum ada.</div>'}
    </div>
    <div style="margin-top:8px"><b>Tren bulanan</b>${trend}</div>
    <div class="sm" style="margin-top:8px">Periode ${used[0]} s/d ${used[used.length - 1]}. Bulan berjalan proporsional.</div>
    <button type="button" class="b p" data-a="ab" style="width:100%;margin-top:12px">Lihat saran budget</button>
  `);
}

function validBackup(o) {
  if (!o || typeof o !== 'object' || Array.isArray(o)) return 'bukan data aplikasi';
  const num = n => typeof n === 'number' && isFinite(n);
  const bad = (a, f) => Array.isArray(a) && a.some(x => !x || typeof x !== 'object' || !f(x));
  if (!Array.isArray(o.wallets) || !o.wallets.length) return 'daftar dompet kosong';
  if (!Array.isArray(o.transactions) || !Array.isArray(o.categories) || !Array.isArray(o.pockets)) return 'struktur data transaksi/kategori/kantong tidak lengkap';
  if (bad(o.wallets, w => typeof w.id === 'string' && typeof w.name === 'string' && num(w.balance))) return 'data dompet rusak';
  if (bad(o.transactions, t => typeof t.id === 'string' && /^\d{4}-\d{2}-\d{2}/.test(t.date || '') && num(t.amount) && typeof t.type === 'string')) return 'data transaksi rusak';
  if (bad(o.categories, c => typeof c.id === 'string' && typeof c.name === 'string')) return 'data kategori rusak';
  if (bad(o.pockets, k => typeof k.id === 'string' && typeof k.walletId === 'string' && num(k.balance))) return 'data kantong rusak';
  if (!Array.isArray(o.receivables) || !Array.isArray(o.recurring) || !Array.isArray(o.goals) || !Array.isArray(o.autos) || !Array.isArray(o.tpls) || !Array.isArray(o.wishlist)) return 'struktur data tidak lengkap';
  const ids = a => new Set(a.map(x => x.id));
  const wids = ids(o.wallets), cids = ids(o.categories), pids = ids(o.pockets);
  if (new Set(o.wallets.map(x => x.id)).size !== o.wallets.length) return 'ID dompet duplikat';
  if (new Set(o.transactions.map(x => x.id)).size !== o.transactions.length) return 'ID transaksi duplikat';
  if (o.transactions.some(t => !wids.has(t.walletId) || (t.toWalletId && !wids.has(t.toWalletId)) || (t.categoryId && !cids.has(t.categoryId)) || (t.pocketId && !pids.has(t.pocketId)))) return 'referensi transaksi tidak valid';
  if (o.pockets.some(k => !wids.has(k.walletId))) return 'referensi dompet kantong tidak valid';
  if (o.recurring.some(x => x.walletId && !wids.has(x.walletId)) || o.autos.some(x => x.walletId && !wids.has(x.walletId)) || o.tpls.some(x => x.walletId && !wids.has(x.walletId)) || o.receivables.some(x => x.walletId && !wids.has(x.walletId))) return 'referensi dompet pada data terkait tidak valid';
  if (o.recurring.some(x => x.categoryId && !cids.has(x.categoryId)) || o.autos.some(x => x.categoryId && !cids.has(x.categoryId)) || o.tpls.some(x => x.categoryId && !cids.has(x.categoryId))) return 'referensi kategori tidak valid';
  if (o.config && o.config.ver > APPV) return 'dibuat oleh versi aplikasi yang lebih baru';
  return '';
}

      const total = sum(rows, r => r.amt), fees = sum(rows, r => r.fee);
      const source = S.wallets.find(w => w.id === v.a);

function trendCard() {
  const BL = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const n = 6, cm = ymOf();
  const ms = Array.from({ length: n }, (_, i) => shiftYm(cm, i - (n - 1)));
  const d = ms.map(m => {
    const g = S.transactions.filter(t => t.date.startsWith(m));
    return {
      m,
      i: sum(g.filter(t => t.type === 'income'), t => t.amount),
      e: sum(g.filter(t => t.type === 'expense'), t => t.amount)
    };
  });
  const head = '<div class="row" style="margin-bottom:6px"><b style="font-size:16px">Tren 6 Bulan</b></div>';
  if (!d.some(x => x.i || x.e)) {
    return `<div class="card" id="trend">${head}<div class="empty">Belum ada transaksi untuk ditampilkan.</div></div>`;
  }
  const mx = Math.max(1, ...d.flatMap(x => [x.i, x.e]));
  const W = 320, H = 180, pl = 30, pb = 22, pt = 16, ch = H - pb - pt, bw = 15, gap = (W - pl - 4) / n;
  const y = v => pt + ch - Math.max(v > 0 ? 2 : 0, v / mx * ch);
  const grid = [0, .5, 1].map(f => {
    const gy = pt + ch - f * ch;
    return `<line x1="${pl}" x2="${W - 4}" y1="${gy}" y2="${gy}" stroke="var(--bd)" stroke-dasharray="${f ? '3 4' : '0'}"/>` +
      (f ? `<text x="0" y="${gy + 3}" font-size="9" style="fill:var(--mut)">${fmtHuman(mx * f)}</text>` : '');
  }).join('');
  const bars = d.map((x, k) => {
    const c = pl + gap * (k + .5), cur = x.m === cm;
    const mi = +x.m.slice(5, 7) - 1;
    return `<rect x="${c - bw - 1}" y="${y(x.i)}" width="${bw}" height="${pt + ch - y(x.i)}" rx="4" style="fill:var(--ok)"/>
      <rect x="${c + 1}" y="${y(x.e)}" width="${bw}" height="${pt + ch - y(x.e)}" rx="4" style="fill:var(--bad)"/>
      <text x="${c}" y="${H - 6}" text-anchor="middle" font-size="10" font-weight="${cur ? 800 : 500}" style="fill:${cur ? 'var(--pri)' : 'var(--mut)'}">${BL[mi]}</text>`;
  }).join('');
  const act = d.filter(x => x.e > 0);
  const avg = act.length ? Math.round(sum(act, x => x.e) / act.length) : 0;
  const top = act.slice().sort((a, b) => b.e - a.e)[0];
  const prev = d[n - 2], now = d[n - 1];
  let delta = '';
  if (prev && prev.e > 0) {
    const p = Math.round((now.e - prev.e) / prev.e * 100);
    delta = `<div class="it"><span class="sm">Pengeluaran vs bulan lalu</span><b class="${p > 0 ? 'tb' : 'tg'}">${p > 0 ? '+' : ''}${p}%</b></div>`;
  }
  return `<div class="card" id="trend">${head}
    <div class="tr-leg"><span><i style="background:var(--ok)"></i>Masuk</span><span><i style="background:var(--bad)"></i>Keluar</span></div>
    <svg class="tr-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pemasukan dan pengeluaran 6 bulan terakhir">${grid}${bars}</svg>
    <div class="il" style="margin-top:12px">
      <div class="it"><span class="sm">Rata-rata keluar / bulan</span><b class="money">${fmask(avg)}</b></div>
      ${top ? `<div class="it"><span class="sm">Terboros: ${BL[+top.m.slice(5, 7) - 1]} ${top.m.slice(0, 4)}</span><b class="tb money">${fmask(top.e)}</b></div>` : ''}
      ${delta}
    </div></div>`;
}

const fmtGroupDate = dStr => {
  const d = dStr.slice(0, 10);
  const t = today();
  if (d === t) return 'Hari Ini';
  
  const yDay = new Date();
  yDay.setDate(yDay.getDate() - 1);
  const yStr = `${yDay.getFullYear()}-${p2(yDay.getMonth() + 1)}-${p2(yDay.getDate())}`;
  if (d === yStr) return 'Kemarin';

  const dt = new Date(d);
  const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
  return `${days[dt.getDay()]}, ${dt.getDate()} ${months[dt.getMonth()]} ${dt.getFullYear()}`;
};

const histAnalyticsView = txList => {
  const inc = sum(txList.filter(t => t.type === 'income'), t => t.amount);
  const exp = sum(txList.filter(t => t.type === 'expense'), t => t.amount);
  const net = inc - exp;
  const daysCount = Math.max(1, new Set(txList.map(t => t.date.slice(0, 10))).size);

  return `

};

const LAZYD = new Map();
let HDAYS = 30;
const renderTimelineList = (txList, fn) => {
  LAZYD.clear();
  if (!txList.length) return '<div class="empty">Tidak ada transaksi.</div>';
  
  const groups = {};
  txList.forEach(t => {
    const d = t.date.slice(0, 10);
    (groups[d] = groups[d] || []).push(t);
  });

  const allKeys = Object.keys(groups);
  const keys = Q.trim() ? allKeys : allKeys.slice(0, HDAYS);
  const more = allKeys.length - keys.length;

  return keys.map(dateKey => {
    const dayTx = groups[dateKey];
    const dayInc = sum(dayTx.filter(t => t.type === 'income'), t => t.amount);
    const dayExp = sum(dayTx.filter(t => t.type === 'expense'), t => t.amount);
    const dayNet = dayInc - dayExp;
    
    let subNetText = '';
    if (dayInc > 0 && dayExp > 0) {
      subNetText = `+${fmtHuman(dayInc)} · -${fmtHuman(dayExp)}`;
    } else if (dayInc > 0) {
      subNetText = `+${fmtHuman(dayInc)}`;
    } else if (dayExp > 0) {
      subNetText = `-${fmtHuman(dayExp)}`;
    } else {
      subNetText = `${dayNet >= 0 ? '+' : ''}${fmtHuman(dayNet)}`;
    }

    const dk = 'd:' + dateKey;
    const isOpen = Q.trim() !== '' || OPEN.has(dk);
    const seenB = new Set(), items = [];
    dayTx.forEach(t => {
      if (t.batchId && dayTx.filter(x => x.batchId === t.batchId && x.type === 'transfer').length > 1) {
        if (seenB.has(t.batchId)) return;
        seenB.add(t.batchId);
        items.push({ batch: dayTx.filter(x => x.batchId === t.batchId) });
      } else items.push(t);
    });
    const mk = () => items.map(it => it.batch ? batchRow(it.batch) : fn(it));
    if (!isOpen) LAZYD.set(dk, mk);
    return `
      <div class="timeline-group day-group${isOpen ? ' open' : ''}" data-fold="${dk}">
        <div class="timeline-header day-head">
          <span>📅 ${fmtGroupDate(dateKey)}</span>
          <span class="row nw" style="gap:8px"><span class="money mask-money">${subNetText}</span>${CHEV}</span>
        </div>
        <div class="day-body"><div class="timeline-list"${isOpen ? '' : ' data-lazy'}>${isOpen ? mk().join('') : ''}</div></div>
      </div>`;
  }).join('') + (more > 0 ? `<button type="button" class="b s tr-add" data-a="moreDays">Tampilkan ${Math.min(30, more)} hari lagi (${more} tersisa)</button>` : '');
};

const catInner = () => {
  const q = CQ.trim().toLowerCase();

  S.categories
    .filter(c => (c.kind || 'expense') === 'expense' && (!q || c.name.toLowerCase().includes(q)))

function catRow(c, mtx, PL) {
  const sp = sum(mtx.filter(t => t.type === 'expense' && t.categoryId === c.id), t => t.amount);
  const B = bud(c, MF);
  const T = tempo(c, MF);
  const has = B > 0 && c.type !== 'tracking' && MF !== 'all';
  const pc = has ? Math.min(100, sp / B * 100) : 0;
  return `<div class="it c fold${OPEN.has(c.id) ? ' open' : ''}" data-fold="${c.id}">
    <div class="row nw fold-head">
      <b class="ell">${esc(c.icon)} ${esc(c.name)}</b>
      <span class="row nw" style="gap:6px"><span class="sm nowrap money">${fmask(sp)}${has ? ' / ' + fmask(B) : ''}</span>${CHEV}</span>
    </div>
    ${has ? `<div class="bar"><i class="${c.type === 'limit' && pc > 90 ? 'x' : ''}" style="width:${pc}%"></i>
      ${T ? `<b class="tick" style="left:${(T.pace * 100).toFixed(1)}%"></b>` : ''}</div>` : ''}
    <div class="fold-body"><div>
      <div class="row sm"><span>${PL} <b class="money">${fmask(sp)}</b> · ${c.type}</span>

      ${has && T ? `<div class="row sm"><span class="${TL[T.st][1]}">${TL[T.st][0]}</span>
        <span class="money">sisa ${fmask(T.perDay)}/hari${T.proj != null ? ' · proyeksi ' + fmask(T.proj) : ''}</span></div>` : ''}
      <div class="fold-actions">

        <button type="button" class="b s" data-a="xC" data-id="${c.id}">🗑 Hapus</button>
      </div>
    </div></div>
  </div>`;
}

window.HW_ALL = window.HW_ALL || false;
function walletChips() {
  const W = S.wallets, LIM = 6;
  if (!W.length) return '';

}

function heroHTML(s, rem, pct) {
  const r = s.limit > 0 ? s.spent / s.limit : (s.spent > 0 ? 1 : 0);
  const st = s.limit <= 0 || r >= 1 ? 'over' : r >= .6 ? 'warn' : 'ok';
  const LBL = { ok: ['✓', 'Aman'], warn: ['!', 'Hati-hati'], over: ['✕', s.limit <= 0 ? 'Tidak ada jatah' : 'Jatah habis'] }[st];
  const over = rem < 0;
  const note = st === 'ok' ? 'Masih longgar, belanja seperlunya.'
    : st === 'warn' ? 'Jatah mulai menipis, pikir dulu sebelum jajan.'
    : over ? `Pengeluaran melewati batas ${fmask(Math.abs(rem))} hari ini.` : 'Sebaiknya tahan pengeluaran hari ini.';
  const cm = ymOf(), mt = S.transactions.filter(t => t.date.startsWith(cm));
  const inc = sum(mt.filter(t => t.type === 'income'), t => t.amount);
  const ex = sum(mt.filter(t => t.type === 'expense'), t => t.amount);
  const o = sum(S.wallets.filter(w => w.type !== 'Tabungan'), w => Math.min(0, w.balance - locked(w.id)));
  return `<div class="card hero st-${st}" aria-label="Batas harian aman dan total saldo">
    <div class="hero-top">
      <div class="sm hero-lbl">🎯 BATAS HARIAN AMAN</div>
      <span class="hero-pill">${LBL[0]} ${LBL[1]}</span>
    </div>
    <div class="hero-big money">${fmask(s.limit)}<small> /hari</small></div>
    <div class="hero-brk">Base ${fmask(s.base)} + sisa kemarin ${fmask(s.carry)}${s.nd > 0 ? `<br>Non-harian hari ini ${fmask(s.nd)} (dibagi ke sisa ${s.days} hari)` : ''}</div>
    <div class="bar hero-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i class="${pct > 90 ? 'x' : ''}" style="width:${pct}%"></i></div>
    <div class="hero-note">${note}</div>
    <div class="hero-stats">
      <div><span>Terpakai</span><b class="money">${fmask(s.spent)}</b></div>
      <div><span>Saldo dihitung</span><b class="money">${fmask(s.bal)}</b></div>
      <div><span>Tagihan</span><b class="money">${fmask(s.bills)}</b></div>
    </div>
    ${s.short > 0 ? `<div class="hero-warn">🔒 Uang kantong terkunci terpakai ${fmask(s.short)}.</div>` : ''}
    <div class="hero-div"></div>
    <div class="hero-total">
      <div class="hero-tl">
        <div class="sm">Total saldo</div>
        <div class="hero-tot money">${fmask(sum(S.wallets, w => w.balance))}</div>
      </div>
    </div>
    ${walletChips()}
    <div class="hero-io">
      <div><span>Masuk bulan ini</span><b class="money tg">${fmask(inc)}</b></div>
      <div><span>Keluar bulan ini</span><b class="money tb">${fmask(ex)}</b></div>
    </div>
    ${o < 0 ? `<div class="hero-warn">Memakai uang kantong terkunci (kurang ${fmask(-o)}).</div>` : ''}
  </div>`;
}

              <button type="button" class="b s" data-a="sim" data-id="${w.id}" title="Simulasi">🧪</button>
              <button type="button" class="b s" data-a="xS" data-id="${w.id}">🗑</button>
            </div>
          </div>
        </div>`).join('') || '<div class="empty">Wishlist kosong.</div>'
    );
  }

  if (OP.has('goals')) {
    h += card('Target Tabungan',
      '<button type="button" class="b s p" data-a="gl">+</button>',
      S.goals.map(g => {
        const sv = sum(S.transactions.filter(t => t.goalId === g.id), t => t.amount) +
          ((S.pockets.find(p => p.linkedGoalId === g.id) || {}).balance || 0);
        const pc = Math.min(100, sv / Math.max(1, g.target) * 100);
        let tip = '';
        if (g.due && sv < g.target) {
          const ml = Math.max(1, Math.round((new Date(g.due) - new Date()) / 2629800000));
          tip = `<div class="sm">Perlu ±${fmask(Math.ceil((g.target - sv) / ml))}/bulan sampai ${esc(g.due)}</div>`;
        }
        return `<div class="it c">
          <div class="row">
            <b>${esc(g.title)}</b>
            <span>
              <button type="button" class="b s g" data-a="dp" data-id="${g.id}">Setor</button>
              <button type="button" class="b s" data-a="xG" data-id="${g.id}">🗑</button>
            </span>
          </div>
          <div class="row sm money"><span>${fmask(sv)}</span><span>${fmask(g.target)} (${Math.round(pc)}%)</span></div>
          <div class="bar"><i style="width:${pc}%"></i></div>
          ${tip}
        </div>`;
      }).join('') || '<div class="empty">Belum ada target.</div>'
    );
  }

  if (OP.has('autos')) {
    h += card('Transaksi Berulang',
      '<button type="button" class="b s p" data-a="au">+</button>',
      S.autos.map(a => `
        <div class="it">
          <div><b>${esc(a.title)}</b><div class="sm">Tiap tanggal ${a.day} · ${a.type === 'income' ? 'pemasukan' : 'pengeluaran'}</div></div>
          <div style="text-align:right">
            <b class="${a.type === 'income' ? 'tg' : 'tb'} money">${fmask(a.amount)}</b>
            <div><button type="button" class="b s" data-a="xA" data-id="${a.id}">🗑</button></div>
          </div>
        </div>`).join('') || '<div class="empty">Belum ada jadwal berulang.</div>'
    );
  }

  if (OP.has('tpls')) {
    h += card('Favorit', '',
      S.tpls.map(t => `
        <div class="it">
          <button type="button" class="b g" data-a="tp" data-id="${t.id}" style="flex:1">⚡ ${esc(t.title)} · ${fmask(t.amount)}</button>
          <button type="button" class="b s" data-a="xF" data-id="${t.id}">🗑</button>
        </div>`).join('') || '<div class="empty">Belum ada favorit. Centang saat mencatat transaksi.</div>'
    );
  }

  if (OP.has('analytics')) {
    const ti = sum(mtx.filter(t => t.type === 'income'), t => t.amount);
    const te = sum(mtx.filter(t => t.type === 'expense'), t => t.amount);
    const net = ti - te;
    h += `<div class="card">
      <div class="an-head">
        <b style="font-size:16px">Analisis ${esc(PL)}</b>
        <div class="actions">
          <button type="button" class="b s" data-a="a3">3 Bln</button>
          <button type="button" class="b s" data-a="rep">Laporan</button>
        </div>
      </div>
      <div class="g2" style="margin:14px 0">
        <div class="it c"><span class="sm">Pemasukan</span><span class="tg money" style="font-size:15px">${fmask(ti)}</span></div>
        <div class="it c"><span class="sm">Pengeluaran</span><span class="tb money" style="font-size:15px">${fmask(te)}</span></div>
      </div>
      <div class="an-net">
        <span>Selisih bersih:</span>
        <b class="money ${net < 0 ? 'tb' : 'tg'}" style="font-size:15px">${net < 0 ? '−' : '+'}${fmask(Math.abs(net))}</b>
      </div>
      ${donut(catData(mtx))}
    </div>`;
    h += trendCard();
  }

  if (OP.has('hist')) {
    const monthLabel = R3 ? '3 bulan terakhir' : PL;
    const nav = `<div class="month-nav" style="margin-bottom:12px">
      <button type="button" class="b s" data-a="mp" aria-label="Bulan sebelumnya">◀</button>
      <span class="label" >${esc(monthLabel)}</span>
      <button type="button" class="b s" data-a="mn" aria-label="Bulan berikutnya">▶</button>
      <button type="button" class="b s" data-a="ma">Semua</button>
      <button type="button" class="b s" data-a="r3">3 Bln</button>
    </div>`;
    h += card('Riwayat Transaksi',
      ``,
      nav + histBody(hist(), t => {
        const w = W(t.walletId), w2 = W(t.toWalletId), c = C(t.categoryId);
        const pkr = S.pockets.find(x => x.id === t.pocketId);
        let amt, cl, sub = (w ? esc(w.name) : '') + (pkr ? ' · 👝 ' + esc(pkr.name) : '');
        let iconCat = c ? c.icon : '📋';

        if (t.type === 'expense') { 
          amt = '−' + fmt(t.amount); cl = 'tb'; 
        } else if (t.type === 'income') { 
          amt = '+' + fmt(t.amount); cl = 'tg'; 
          if (!c) iconCat = '📥';
        } else if (t.type === 'adjust') { 
          amt = (t.amount >= 0 ? '+' : '−') + fmt(Math.abs(t.amount)); cl = 'sm bold'; iconCat = '⚙️';
        } else { 
          amt = fmt(t.amount); cl = 'sm bold'; sub += ' → ' + (w2 ? esc(w2.name) : '🎯'); iconCat = '⇄';
        }

        const timeStr = t.date.includes('T') ? t.date.split('T')[1].slice(0, 5) : '';

        const full = esc(t.date.replace('T', ' '));
        return `
        <div class="t-card fold${OPEN.has(t.id) ? ' open' : ''}" data-fold="${t.id}">
          <div class="t-icon-box">${esc(iconCat)}</div>
          <div class="t-main-info">
            <div class="t-title">${esc(t.title)}</div>
            <div class="t-sub">${timeStr || full.slice(0, 10)}${c ? ' · ' + esc(c.name) : ''}</div>
          </div>
          <div class="t-right"><b class="${cl}"><span class="mask-money money">${amt}</span></b>${CHEV}</div>
          <div class="fold-body"><div>
            <div class="t-sub">${full} · ${c ? esc(c.name) : 'Tanpa kategori'} · ${sub}</div>
            <div class="fold-actions">
              <button type="button" class="b s" data-a="eT" data-id="${t.id}">✏️ Edit</button>
              <button type="button" class="b s" data-a="xT" data-id="${t.id}">🗑 Hapus</button>
            </div>
          </div></div>
        </div>`;
      }).join()
    );
  }

  const appEl = $('#app');
  appEl.innerHTML = h;

  if (isChanged) {
    appEl.classList.add('tab-enter');
    clearTimeout(tabAnimTimer);
    tabAnimTimer = setTimeout(() => appEl.classList.remove('tab-enter'), 800);
  }

  const cur = MORE.includes(TAB) ? 'more' : TAB;
  $('#bn').innerHTML = [
    ['home', '🏠', 'Beranda'],
    ['hist', '📋', 'Riwayat'],
    ['wallets', '💳', 'Dompet'],
    ['categories', '📁', 'Anggaran'],
    ['more', '☰', 'Lainnya']
  ].map(([k, i, l]) =>
    `<button type="button" class="${cur === k ? 'on' : ''}" data-a="sec" data-v="${k}" aria-current="${cur === k ? 'page' : 'false'}">
      <span>${i}</span>${l}
    </button>`
  ).join('');

  if (LT !== TAB) {
    window.scrollTo(0, 0);
    LT = TAB;
  }
}

/* Dispatcher */
function shiftM(n) {
  if (MF === 'all') n = 0;
  const b = MF === 'all' ? ymOf() : MF;
  MF = shiftYm(b, n);
}

const ACT = {
  sec(b) { TAB = b.dataset.v; },
  moreDays() { HDAYS += 30; },
  pv() { S.config.privacyMode = !S.config.privacyMode; },
  hideDemo() { S.config.demoBanner = false; },
  sft(b) { FT = b.dataset.v; },
  gg(b) {
    const g = b.dataset.v;
    GC = GC.includes(g) ? GC.filter(x => x !== g) : [...GC, g];
  },
  hq() {
    const el = $('[name=hq]');
    const ps = el ? parseQuickMulti(el.value) : [];
    if (!ps.length) {
      HQV = el ? el.value : '';
      toast('Tulis nominal, mis. kopi 35k');
      return;
    }
    HQV = '';
    ps.forEach(p => addTx({
      id: uid('t'), date: nowL(), type: p.type, title: p.title, amount: p.amount,
      walletId: p.walletId, categoryId: p.categoryId,
      pocketId: p.pocketId || undefined, notes: el.value.trim()
    }));
    toast(ps.length > 1 ? ps.length + ' transaksi tercatat ✓ ' + fmt(sum(ps, p => p.amount))
      : 'Tercatat ✓ ' + fmt(ps[0].amount));
  },
  th() {
    S.config.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
  },
  mfx() {
    isManualOpen = !isManualOpen; applyMode();
  },
  mode(b) { isManualOpen = b.dataset.m === 'm'; applyMode(); },
  mqx(b) { if (MQ) { MQ.splice(+b.dataset.i, 1); mqRender(); } },
  qchip(b) {
    const q = $('[name=q]'); if (!q) return;
    const n = +b.dataset.n || 0, t = b.dataset.t;
    let v = q.value.slice(0, q.value.length - n);
    v = b.dataset.k === 'add' ? v + (v && !/\s$/.test(v) ? ' ' : '') + t : v + t + ' ';
    q.value = v; q.focus(); q.dispatchEvent(new Event('input', { bubbles: true }));
  },
  qx() { FORMS.tx(); },
  txW(b) { FORMS.tx(b.dataset.id); },
  trW(b) { FORMS.tr(b.dataset.id); },
  f(b) { FORMS[b.dataset.v](); },
  sh() { FORMS.bk(); },
  eT(b) { FORMS.edit(b.dataset.id); },
  ec(b) { FORMS.ecat(b.dataset.id); },
  gl() { FORMS.goal(); },
  dp(b) { FORMS.dep(b.dataset.id); },
  au() { FORMS.auto(); },
  rep() { REP(); },
  csv() { CSV(); },
  xG(b) {
    const id = b.dataset.id;
    del('Target dihapus (setoran tetap di riwayat).', () => {
      S.goals = S.goals.filter(x => x.id !== id);
      S.pockets.forEach(k => { if (k.linkedGoalId === id) delete k.linkedGoalId; });
    });
  },
  xA(b) {
    const id = b.dataset.id;
    del('Jadwal berulang dihapus.', () => { S.autos = S.autos.filter(x => x.id !== id); });
  },
  xF(b) {
    const id = b.dataset.id;
    del('Favorit dihapus.', () => { S.tpls = S.tpls.filter(x => x.id !== id); });
  },
  tp(b) {
    const t = S.tpls.find(x => x.id === b.dataset.id);
    if (!t) return;
    const wid = S.wallets.find(w => w.id === t.walletId) ? t.walletId : S.wallets[0]?.id;
    if (!wid) { toast('Tidak ada dompet'); return; }
    addTx({
      id: uid('t'), date: nowL(), type: t.type, title: t.title, amount: t.amount,
      walletId: wid, categoryId: t.categoryId, pocketId: t.pocketId
    });
    toast('Favorit dicatat ✓');
  },
  mp() { R3 = false; shiftM(-1); },
  mn() { R3 = false; shiftM(1); },
  ma() { R3 = false; MF = 'all'; },
  r3() { R3 = true; },
  a3() { analyze3(); },
  pk(b) { PW = PW === b.dataset.id ? '' : b.dataset.id; },
  sv() { FORMS.sv(); },
  pnew(b) { FORMS.poc(b.dataset.id); },
  ped(b) { FORMS.poc(null, b.dataset.id); },
  pmv(b) { FORMS.mv(b.dataset.id); },
  pdel(b) {
    const p = S.pockets.find(x => x.id === b.dataset.id);
    if (p) {
      del(`Kantong dihapus. Saldo (${fmtT(p.balance)}) kembali ke kantong utama.`, () => {
        S.pockets = S.pockets.filter(x => x !== p);
      });
    }
  },
  stg() { FORMS.set(); },
  adj(b) { FORMS.adj(b.dataset.id); },
  cl: closeM,
  yes() {
    const f = YES;
    YES = null;
    closeM();
    if (f) f();
  },
  cp(b) {
    const el = $('#' + b.dataset.t);
    if (!el) return;
    el.select();
    try { el.setSelectionRange(0, 999999); } catch (e) {}
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    try {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(el.value);
        ok = true;
      }
    } catch (e) {}
    toast(ok ? 'Tersalin ✓' : 'Tekan lama lalu pilih Salin');
  },
  rs() {
    try {
      const raw = JSON.parse($('#t2').value);
      const er = validBackup(raw);
      if (er) { toast('Cadangan ditolak: ' + er); return; }
      S = norm(raw);
      migCat(); migBud(); dropBdg(); migInc();
      closeM();
      toast('Data dipulihkan ✓');
    } catch (e) {
      toast('Format JSON tidak valid');
    }
  },
  rst() {
    info('Reset data?', 'Semua data diganti data contoh. Pastikan sudah menyalin cadangan.', () => {
      S = INIT();
      toast('Data direset');
    });
  },
  xTB(b) {
    const id = b.dataset.id, list = S.transactions.filter(t => t.batchId === id);
    if (!list.length) return;
    del('Semua transfer dan biaya admin dalam kiriman ini dibatalkan, saldo dikembalikan.', () => {
      list.slice().reverse().forEach(t => eff(t, -1));
      S.transactions = S.transactions.filter(t => t.batchId !== id);
    });
  },
  xT(b) {
    const t = S.transactions.find(x => x.id === b.dataset.id);
    if (!t) return;
    del('Saldo dompet akan dikembalikan seperti sebelum transaksi ini.', () => {
      eff(t, -1);
      if (t.billId) {
        const r = S.recurring.find(x => x.id === t.billId);
        if (r) r.paidMonth = null;
      }
      if (t.receivableId) {
        const r = S.receivables.find(x => x.id === t.receivableId);
        if (r) r.status = 'unpaid';
      }
      S.transactions = S.transactions.filter(x => x !== t);
    });
  },
  xW(b) {
    if (S.wallets.length <= 1) return toast('Minimal 1 dompet');
    const id = b.dataset.id;
    const w = S.wallets.find(x => x.id === id);
    if (w && (w.balance !== 0 || S.pockets.some(p => p.walletId === id && p.balance !== 0))) {
      toast('Kosongkan saldo dan pindahkan/hapus kantong sebelum menghapus dompet'); return;
    }
    del('Dompet dihapus. Riwayat lama tetap tersimpan; referensi aktif dibersihkan.', () => {
      S.wallets = S.wallets.filter(x => x.id !== id);
      S.pockets = S.pockets.filter(p => p.walletId !== id);
      S.recurring = S.recurring.filter(r => r.walletId !== id);
      S.autos = S.autos.filter(a => a.walletId !== id);
      S.tpls = S.tpls.filter(t => t.walletId !== id);
      if (FW === id) FW = '';
      if (PW === id) PW = '';
    });
  },
  xC(b) {
    const id = b.dataset.id;
    const cat = S.categories.find(x => x.id === id);
    if (!cat) return;
    const candidates = S.categories.filter(c => c.id !== id && (c.kind || 'expense') === (cat.kind || 'expense'));
    const to = (candidates.find(c => /lainnya|darurat/i.test(c.name)) || candidates[0] || {}).id;
    if (!to || to === id) {
      toast('Tidak bisa menghapus kategori cadangan terakhir');
      return;
    }
    del('Kategori dihapus. Transaksi terkait dipindah ke Lainnya/Darurat.', () => {
      const reassign = a => a.forEach(x => { if (x.categoryId === id) x.categoryId = to; });
      reassign(S.transactions);
      reassign(S.recurring);
      reassign(S.autos);
      reassign(S.tpls);
      S.categories = S.categories.filter(x => x.id !== id);
      if (FC === id) FC = '';
    });
  },
  eB(b) { FORMS.bill(b.dataset.id); },
  xB(b) {
    const id = b.dataset.id;
    del('Tagihan rutin dihapus.', () => { S.recurring = S.recurring.filter(x => x.id !== id); });
  },
  xP(b) {
    const id = b.dataset.id;
    del('Catatan piutang dihapus.', () => { S.receivables = S.receivables.filter(x => x.id !== id); });
  },
  xS(b) {
    const id = b.dataset.id;
    del('Item wishlist dihapus.', () => {
      S.wishlist = S.wishlist.filter(x => x.id !== id);
      S.pockets.forEach(k => { if (k.linkedWishlistId === id) delete k.linkedWishlistId; });
    });
  },
  payB(b) {
    const r = S.recurring.find(x => x.id === b.dataset.id);
    if (!r) return;
    if (!S.wallets.find(w => w.id === r.walletId)) {
      toast('Dompet tagihan sudah tidak ada');
      return;
    }
    addTx({
      id: uid('t'), date: nowL(), type: 'expense', title: 'Tagihan: ' + r.title,
      amount: r.amount, walletId: r.walletId, categoryId: r.categoryId,
      billId: r.id, pocketId: r.pocketId
    });
    r.paidMonth = ymOf();
    toast('Tagihan dibayar ✓');
  },
  payR(b) {
    const p = S.receivables.find(x => x.id === b.dataset.id);
    if (!p) return;
    p.status = 'paid';
    const wid = S.wallets.find(w => w.id === p.walletId) ? p.walletId : null;
    if (!wid) { p.status = 'unpaid'; toast('Dompet asal piutang sudah dihapus. Edit/pindahkan piutang ke dompet aktif terlebih dahulu.'); return; }
    addTx({
      id: uid('t'), date: nowL(), type: 'income',
      title: 'Pelunasan: ' + p.person, amount: p.amount, receivableId: p.id,
      walletId: wid, categoryId: incId('Pengembalian / Refund') || ''
    });
    toast('Pelunasan dicatat ✓');
  },
  buyW(b) {
    const w = S.wishlist.find(x => x.id === b.dataset.id);
    if (!w) return;
    const p = S.pockets.find(x => x.linkedWishlistId === w.id);
    if (!p) {
      info('Beli ' + esc(w.title), 'Hubungkan item ini ke kantong tabungan dulu (menu Dompet → Kantong, pilih tautan wishlist), lalu cicil isinya. Saat dibeli dari kantong, uang cicilan tidak memotong batas harian.');
      return;
    }
    openM('Beli ' + esc(w.title), `
      <label>Harga akhir</label>
      <input name="amt" type="number" inputmode="numeric" value="${w.cost}">
      <div class="sm" style="margin-top:8px">Diambil dari ${esc(p.icon)} ${esc(p.name)} (terkumpul <b class="money">${fmask(p.balance)}</b>). Bagian dari kantong <b>tidak memotong</b> batas harian. Kekurangan harga diambil dari saldo bebas dan memotong batas harian.</div>`, v => {
      const amt = requirePositive(v.amt);
      if (amt == null) return false;
      const cat = (S.categories.find(c => /belanja|lain/i.test(c.name)) || {}).id || '';
      const t = { id: uid('t'), date: nowL(), type: 'expense', title: w.title, amount: amt, walletId: p.walletId, categoryId: cat, pocketId: p.id, notes: 'Beli dari wishlist' };
      if (addTx(t) === false) return false;
      S.wishlist = S.wishlist.filter(x => x.id !== w.id);
      S.pockets.forEach(k => { if (k.linkedWishlistId === w.id) delete k.linkedWishlistId; });
      const hit = amt - (t.pocketAmt || 0);
      toast(hit > 0 ? 'Dibeli ✓ ' + fmt(hit) + ' memotong batas harian' : 'Dibeli ✓ tanpa memotong batas harian');
    });
  },
  sim(b) {
    const w = S.wishlist.find(x => x.id === b.dataset.id);
    if (!w) return;
    const a = safe(), z = safe(w.cost);
    info('Simulasi ' + esc(w.title), `
      Harga: <b class="money">${fmask(w.cost)}</b><br>
      Batas harian sekarang: <b class="money">${fmask(a.limit)}</b><br>
      Setelah beli: <b class="money">${fmask(z.limit)}</b><br>
      Turun: <b class="tb money">${fmask(a.limit - z.limit)}/hari</b> selama ${a.days} hari`);
  },
  ab() {
    AB = evalAB();
    info('Evaluasi Budget',
      (AB.length
        ? AB.map(r => `
            <div class="it c" style="margin-bottom:8px">
              <b>${r.icon} ${esc(r.name)}</b>
              <div class="row sm">
                <span>Rata-rata ${r.n} bln: <b class="money">${fmask(r.avg)}</b><br>Lama: ${fmask(r.old)}</span>
                <span style="text-align:right" class="${r.code === 'up' ? 'tw' : 'tg'}">Usulan<br><b class="money">${fmask(r.nb)}</b></span>
              </div>
            </div>`).join('') +
          '<button type="button" class="b p" data-a="apAB" style="width:100%;margin-top:10px">Terapkan semua</button>'
        : '<div class="empty">Belum ada saran. Butuh riwayat pengeluaran bulan lalu.</div>') +
      '<div class="sm" style="margin-top:10px">Naik 10% jika over-budget; turun (+5% ruang) jika rata-rata di bawah 70% budget.</div>'
    );
  },
  apAB() {
    AB.forEach(r => {
      const c = S.categories.find(x => x.id === r.id);
      if (c) c.budget = r.nb;
    });
    closeM();
    toast(AB.length + ' budget diperbarui ✓');
  },
  co(b) {
    CT = b.dataset.v || null;
    CE = '';
    $('#ce').textContent = '';
    $('#cr').textContent = '0';
    $('#cv').hidden = false;
  },
  ck(b) {
    const v = b.dataset.v;
    if (v === 'C') CE = '';
    else if (v === '⌫') CE = CE.slice(0, -1);
    else if (v === '=') CE = String(ev(CE));
    else CE += v;
    $('#ce').textContent = CE || '0';
    $('#cr').textContent = fmt(ev(CE));
  },

/* Convert Emoji Nodes to inline SVG */
const convertEmojis = root => {
  const RT = /\p{Extended_Pictographic}/u;
  const RX = /\p{Extended_Pictographic}(?:\uFE0F|\u200D\p{Extended_Pictographic}\uFE0F?)*/gu;
  
  const replaceNode = n => {
    const t = document.createElement('template');
    t.innerHTML = esc(n.nodeValue).replace(RX, m => ico(E_MAP[[...m][0]]));
    n.replaceWith(t.content);
  };

  if (root.nodeType === 3) {
    const pp = root.parentNode;
    if (pp && !/^(TEXTAREA|OPTION|SCRIPT|STYLE)$/.test(pp.nodeName) && !pp.closest('svg') && RT.test(root.nodeValue)) replaceNode(root);
    return;
  }
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (w.nextNode()) {
    const n = w.currentNode, p = n.parentNode;
    if (RT.test(n.nodeValue) && !/^(TEXTAREA|OPTION|SCRIPT|STYLE)$/.test(p.nodeName) && !p.closest('svg')) {
      nodes.push(n);
    }
  }
  nodes.forEach(replaceNode);
};

<script>
document.addEventListener('click', e => {
  const f = e.target.closest('[data-fold]');
  if (!f || e.target.closest('button,a,input,select,textarea')) return;
  const y0 = window.scrollY;
  if (y0 > 0) {
    const keep = () => { if (window.scrollY < y0 - 60) window.scrollTo(0, y0); };
    requestAnimationFrame(() => { keep(); requestAnimationFrame(keep); });
  }
  const L = f.querySelector(':scope>.day-body>.timeline-list[data-lazy]');
  if (L) {
    L.removeAttribute('data-lazy');
    const mk = LAZYD.get(f.dataset.fold), rows = mk ? mk() : [];
    L.innerHTML = rows.slice(0, 12).join('');
    if (window.__maskAll) window.__maskAll();
    let i = 12;
    const step = () => {
      if (!L.isConnected || i >= rows.length) { if (window.__maskAll) window.__maskAll(); return; }
      L.insertAdjacentHTML('beforeend', rows.slice(i, i + 20).join(''));
      i += 20;
      requestAnimationFrame(step);
    };
    if (rows.length > 12) requestAnimationFrame(step);
  }
  document.body.classList.add('scrolling');
  clearTimeout(window.__fT);
  window.__fT = setTimeout(() => document.body.classList.remove('scrolling'), 450);
  if (f.classList.toggle('open')) OPEN.add(f.dataset.fold); else OPEN.delete(f.dataset.fold);
});

<script>
function syncBill(f) {
  if (!f || !f.elements || !f.elements.eom) return;
  const el = f.elements, day = document.getElementById('blDay'), mon = document.getElementById('blMon'), row = document.getElementById('blRow');
  if (!day || !mon || !row) return;
  day.hidden = el.eom.checked;
  mon.hidden = el.cycle.value !== 'year';
  row.classList.toggle('one', day.hidden !== mon.hidden);
  row.hidden = day.hidden && mon.hidden;
}
document.addEventListener('change', e => {
  if (e.target.name === 'eom' || e.target.name === 'cycle') syncBill(e.target.form);
});

    if (rows.querySelectorAll('.tr-row').length >= 12) { toast('Maksimal 12 tujuan'); return; }
    rows.insertAdjacentHTML('beforeend', trRow());
    const last = rows.lastElementChild;

    last.querySelector('.tr-m').focus(); trSum(f);
  } else if (e.target.closest('[data-trdel]')) {

    const tot = Math.floor(ev(f.elements.tot.value)), list = [...rows.querySelectorAll('.tr-m')];
    if (!(tot > 0)) { toast('Isi total yang mau dibagi'); return; }
    const each = Math.floor(tot / list.length), rest = tot - each * list.length;
    list.forEach((inp, i) => { inp.value = each + (i === 0 ? rest : 0); });
    trSum(f);
  }
});

/* angka bergulir saat diintip di mode secret */
function rollReveal(el) {
  const tmp = document.createElement('div'); tmp.innerHTML = el.dataset.o || '';
  const full = tmp.textContent, mt = full.match(/(\d[\d.]*)(?:,(\d+))?/);
  if (!mt || matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = full; return; }
  const dec = mt[2] || '', target = parseFloat(mt[1].replace(/\./g, '') + (dec ? '.' + dec : ''));
  const pre = full.slice(0, mt.index), post = full.slice(mt.index + mt[0].length);
  const nf = new Intl.NumberFormat('id-ID', { minimumFractionDigits: dec.length, maximumFractionDigits: dec.length });
  const t0 = performance.now(), D = 750;
  el.textContent = pre + nf.format(0) + post;
  const step = now => {
    if (!el.isConnected || !el.classList.contains('reveal')) return;
    const k = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - k, 3);
    el.textContent = pre + nf.format(target * e) + post;
    if (k < 1) requestAnimationFrame(step); else el.textContent = full;
  };
  requestAnimationFrame(step);
}
</script>

/* Laporan Keuangan PDF (dibuat di perangkat, tanpa pustaka luar) */

    b.textContent = txt; b.hidden = false;
    b.style.animation = 'none'; void b.offsetWidth; b.style.animation = '';
    hm.querySelectorAll('.hd-fx').forEach(x => x.remove());
    const sv = hm.querySelector('svg');
    if (fx) { const f = document.createElement('span'); f.className = 'hd-fx'; f.innerHTML = FX[fx]; hm.appendChild(f); }
    if (sv && anim) { sv.classList.remove('nod'); void sv.getBoundingClientRect(); sv.classList.add(anim); }
    clearTimeout(T1); clearTimeout(T2);
    T1 = setTimeout(() => { b.hidden = true; }, ms);
    T2 = setTimeout(() => { hm.querySelectorAll('.hd-fx').forEach(x => x.remove()); if (sv) sv.classList.remove('nod'); }, ms);
  };
  // pesan sesuai kondisi; return true jika ada pesan khusus
  const say = () => {
    const { s, rem, over, sv } = state();
    if (over) { show(pick(OVER), 7500, true, '', ''); return true; }
    if (!sv) return false;
    const tail = s.spent > 0 ? 'sisa ' + fmt(rem) + ' ikut ke besok' : 'sisa kemarin ' + fmt(s.carry) + ' ikut ke limit hari ini';
    const v = pick(['proud', 'piggy', 'nod']);
    if (v === 'proud') show('Bangga banget sama kamu! Hemat terus, ' + tail + '.', 5500, false, 'proud', '');
    else if (v === 'piggy') show('Dikumpulin buat modal kita besok (' + tail.replace(/^sisa( kemarin)? /, '') + ')', 5500, false, 'piggy', '');
    else show('Mantap... (manggut-manggut) ' + tail + '.', 5500, false, '', 'nod');
    return true;
  };
  window.__hdTap = () => {
    const sv = document.querySelector('#hdm svg');
    if (sv) {
      const shy = tapN++ % 2 === 0;
      sv.classList.remove('salting', 'blink'); void sv.getBoundingClientRect();
      sv.classList.add(shy ? 'salting' : 'blink');
      if (shy) { const hm = document.getElementById('hdm'); if (hm && !hm.querySelector('.hd-fx')) { const f = document.createElement('span'); f.className = 'hd-fx'; f.innerHTML = FX.shy; hm.appendChild(f); setTimeout(() => f.remove(), 1200); } }
    }
    return say();
  };
  document.addEventListener('click', e => {
    if (e.target.closest('#hdsay')) { bub().hidden = true; clearTimeout(T1); }
  });
  const base = window.render;

  // ===== maskot lebih hidup: gerakan santai, reaksi transaksi, celetukan =====
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const qs1 = x => document.querySelector(x);
  const anim = (cls, ms) => { const sv = qs1('#hdm svg'); if (!sv) return; sv.classList.remove(cls); void sv.getBoundingClientRect(); sv.classList.add(cls); setTimeout(() => sv.classList.remove(cls), ms); };
  const pop = (key, ms) => { const hm = qs1('#hdm'); if (!hm) return; hm.querySelectorAll('.hd-fx').forEach(x => x.remove()); const f = document.createElement('span'); f.className = 'hd-fx'; f.innerHTML = FX[key]; hm.appendChild(f); setTimeout(() => f.remove(), ms); };
  const deco = () => {
    const sv = qs1('#hdm svg'); if (!sv || sv.dataset.d) return; sv.dataset.d = 1;
    const t = sv.querySelector('.pg-all > path'); if (t) t.classList.add('pg-tail');
    sv.querySelectorAll('.pg-eye').forEach(g => { const c = g.querySelectorAll('circle'); [c[1], c[2]].forEach(x => x && x.classList.add('pg-pu2')); });
  };
  const hmEl = qs1('#hdm');
  if (hmEl) { new MutationObserver(deco).observe(hmEl, { childList: true }); deco(); }
  if (!calm) {
    const bl = () => { const sv = qs1('#hdm svg'); if (!sv || document.hidden) return; sv.querySelectorAll('.pg-eye').forEach(e => { e.classList.remove('bl'); void e.getBoundingClientRect(); e.classList.add('bl'); }); };
    const blinkLoop = () => { bl(); if (Math.random() < .25) setTimeout(bl, 260); setTimeout(blinkLoop, 2200 + Math.random() * 3800); };
    const look = () => {
      const dx = pick([-2.4, 2.4, 0, 1.6]);
      document.querySelectorAll('#hdm .pg-pu2').forEach(x => { x.style.transform = 'translate(' + dx + 'px,0)'; });
      setTimeout(() => document.querySelectorAll('#hdm .pg-pu2').forEach(x => { x.style.transform = ''; }), 900);
      setTimeout(look, 4000 + Math.random() * 5000);
    };
    setTimeout(blinkLoop, 1500); setTimeout(look, 3000);
  }
  // reaksi saat mencatat transaksi
  const acc = { inc: 0, exp: 0, n: 0, goal: 0 }; let RT;
  const react = () => {
    const a = { ...acc }; acc.inc = acc.exp = acc.n = acc.goal = 0;
    const s = safe();
    if (a.inc > 0) { pop('proud', 1800); anim('hop', 1000); }
    else if (a.goal > 0 && a.n === 0) { pop('piggy', 1800); anim('nod', 3400); }
    else if (a.n > 0 && a.exp === 0) { pop('proud', 1800); anim('hop', 1000); }
    else if (a.exp > 0) {
      const before = Math.max(1, s.limit - (s.spent - a.exp));
      if (s.spent > s.limit || a.exp > .5 * before) { pop('shock', 1600); anim('shock', 800); }
      else anim('munch', 1100);
    }
  };
  const _add = window.addTx;
  window.addTx = function (t) {
    const r = _add.apply(this, arguments);
    if (r !== false && t) {
      if (t.type === 'income') acc.inc += t.amount;
      else if (t.type === 'expense') { const d = isDaily(t); if (d || lockedPart(t) > 0) { acc.n++; acc.exp += d ? t.amount - lockedPart(t) : 0; } }
      else if (t.type === 'goal') acc.goal++;
      clearTimeout(RT); RT = setTimeout(react, 700);
    }
    return r;
  };
  // celetukan spontan
  let QT, lastQ = '';
  const quipNow = () => {
    const q = qs1('#hdq'), b = bub();
    if (document.hidden || qs1('.ov') || !q || (b && !b.hidden) || !q.hidden) return;
    const h = new Date().getHours(), dow = new Date().getDay();
    const { s, over, sv } = state();
    let P = h >= 5 && h < 11 ? ['Pagi! Kopi dulu, baru catat pengeluaran.', 'Semangat pagi, jatah hari ini masih utuh.']
      : h < 15 && h >= 11 ? ['Jangan lupa makan siang, dan catat juga ya.', 'Siang-siang gini enaknya yang dingin, hehe.']
      : h >= 15 && h < 19 ? ['Sore, ada yang belum dicatat?', 'Hampir malam, cek jatah harianmu yuk.']
      : ['Malam, waktunya cek pengeluaran hari ini.', 'Udah malam, istirahat ya.'];
    if (over) P = P.concat(['Hari ini agak boros, tapi nggak apa-apa.', 'Tenang, aku masih di sini nemenin.']);
    else if (s.spent < .6 * s.limit) P = P.concat(['Jatah hari ini masih aman, mantap.', 'Hemat terus, sisanya jadi bekal besok.']);
    if (s.carry > 0) P.push('Ada sisa kemarin yang ikut ke hari ini.');
    if (h >= 17 && !S.transactions.some(t => t.date.startsWith(today()))) P.push('Hari ini belum ada catatan. Ada yang kelewat?');
    if (dow === 0 || dow === 6) P.push('Akhir pekan, jangan lupa catat jajannya.');
    if (s.days <= 3) P.push('Tinggal ' + s.days + ' hari lagi bulan ini.');
    P = P.filter(x => x !== lastQ); const txt = pick(P); lastQ = txt;
    q.textContent = txt; q.hidden = false; q.style.animation = 'none'; void q.offsetWidth; q.style.animation = '';
    anim('munch', 1100);
    clearTimeout(QT); QT = setTimeout(() => { q.hidden = true; }, 5000);
  };
  const quipLoop = () => { try { quipNow(); } catch (e) {} setTimeout(quipLoop, 50000 + Math.random() * 40000); };
  setTimeout(quipLoop, 20000);
  const chk = () => {
    try {
      const { over, sv } = state(), key = today() + (over ? 'o' : sv ? 's' : 'n');
      if (key !== lastKey) { const first = !lastKey; lastKey = key; if (over || sv) setTimeout(say, first ? 1500 : 500); }
    } catch (err) { console.error(err); }
  };
  window.render = function () { base(); chk(); };
  chk();
})();
</script>
<script id="v37-kb">
(() => {
  const vv = window.visualViewport;
  if (vv) {
    const upd = () => {
      const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
      const r = document.documentElement.style;
      r.setProperty('--kb', kb + 'px');
      r.setProperty('--vvh', Math.round(vv.height) + 'px');
    };
    vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); upd();
  }
  document.addEventListener('focusin', e => {
    const t = e.target;
    if (t.closest && t.closest('.mod') && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))
      setTimeout(() => t.scrollIntoView({ block: 'center', behavior: 'smooth' }), 350);
  });
})();
</script>
